<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f1e8"><link rel="manifest" href="manifest.json"><title>我的記帳 2.0</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f6f1e8;color:#302e2a;margin:0}.w{max-width:720px;margin:auto;padding:18px}.c{background:#fffdf9;border:1px solid #e7dfd3;border-radius:18px;padding:16px;margin:10px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:9px}.s{background:#fffdf9;border:1px solid #e7dfd3;border-radius:16px;padding:13px}.s small{color:#817c74}.s b{display:block;font-size:20px;margin-top:5px}input,select,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #e2dbd1;border-radius:11px;background:white;font-size:16px}label{font-size:12px;color:#817c74;display:block;margin:7px 0 4px}.btn{background:#746b5e;color:white;font-weight:bold}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee7de}.muted{font-size:12px;color:#817c74}.good{color:#52705b}.bad{color:#ad6666}.bar{height:10px;background:#ece6dd;border-radius:99px;overflow:hidden}.fill{height:100%;background:#746b5e}@media(max-width:520px){.row{grid-template-columns:1fr}}</style></head><body><div class="w"><h1>我的記帳</h1><div class="muted">記帳 × 預算 × 存錢計畫</div>
<div class="g"><div class="s"><small>本月收入</small><b id="inc">$0</b></div><div class="s"><small>本月支出</small><b id="exp">$0</b></div><div class="s"><small>本月還能花</small><b id="left">$0</b></div><div class="s"><small>本月已存</small><b id="sav">$0</b></div></div>
<div class="c"><b>🎯 每月存錢計畫</b><div class="row"><div><label>月薪</label><input id="salary" type="number"></div><div><label>每月存款目標</label><input id="goal" type="number"></div></div><div class="row"><div><label>房貸</label><input id="mortgage" type="number"></div><div><label>其他固定支出</label><input id="fixed" type="number"></div></div><button id="planbtn" class="btn" style="margin-top:10px">儲存計畫</button><p id="goaltext"></p><div class="bar"><div id="fill" class="fill"></div></div><p id="hint" class="muted"></p></div>
<div class="c"><b>＋ 新增一筆</b><div class="row"><div><label>日期</label><input id="date" type="date"></div><div><label>類型</label><select id="type"><option value="expense">支出</option><option value="income">收入</option><option value="saving">存款</option></select></div></div><div class="row"><div><label>金額</label><input id="amount" type="number"></div><div><label>分類</label><select id="cat"><option>餐飲</option><option>交通</option><option>購物</option><option>房貸</option><option>水電網路</option><option>娛樂</option><option>醫療</option><option>保險稅金</option><option>投資</option><option>薪資</option><option>獎金</option><option>存錢</option><option>其他</option></select></div></div><label>備註</label><input id="note"><button id="add" class="btn" style="margin-top:10px">新增記帳</button></div>
<div class="c"><b>📅 月報表</b><label>查看月份</label><input id="month" type="month"><div id="summary"></div></div><div class="c"><b>明細</b><div id="list"></div><button id="export" style="margin-top:10px">匯出本月 CSV</button><p class="muted">資料儲存在你的瀏覽器內，建議每月匯出備份。</p></div>
<script>
const $=x=>document.getElementById(x),K='my-money-tracker-v1',P='money-plan-v2';let r=JSON.parse(localStorage.getItem(K)||'[]'),p=JSON.parse(localStorage.getItem(P)||'{"salary":50000,"goal":10000,"mortgage":23000,"fixed":7000}');const money=n=>'$'+Math.round(n||0).toLocaleString('zh-TW');let d=new Date(),ds=d.toISOString().slice(0,10);date.value=ds;month.value=ds.slice(0,7);['salary','goal','mortgage','fixed'].forEach(k=>$(k).value=p[k]);
function save(){localStorage.setItem(K,JSON.stringify(r));render()} planbtn.onclick=()=>{['salary','goal','mortgage','fixed'].forEach(k=>p[k]=+$((k)).value||0);localStorage.setItem(P,JSON.stringify(p));render()};add.onclick=()=>{let a=+amount.value;if(!a)return alert('請輸入金額');r.push({id:Date.now(),date:date.value,type:type.value,amount:a,category:cat.value,note:note.value});amount.value='';note.value='';save()};month.onchange=render;
function render(){let m=month.value,x=r.filter(a=>a.date.startsWith(m)),i=x.filter(a=>a.type==='income').reduce((s,a)=>s+a.amount,0),e=x.filter(a=>a.type==='expense').reduce((s,a)=>s+a.amount,0),v=x.filter(a=>a.type==='saving').reduce((s,a)=>s+a.amount,0),budget=(i||p.salary)-p.mortgage-p.fixed-p.goal;inc.textContent=money(i);exp.textContent=money(e);sav.textContent=money(v);left.textContent=money(Math.max(0,budget-e));goaltext.textContent=`存錢進度：${money(v)} / ${money(p.goal)}`;fill.style.width=Math.min(100,p.goal?v/p.goal*100:0)+'%';hint.textContent=`扣除房貸、固定支出與存款目標後，每月生活彈性預算約 ${money(Math.max(0,budget))}。`;let c={};x.filter(a=>a.type==='expense').forEach(a=>c[a.category]=(c[a.category]||0)+a.amount);summary.innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(a=>`<div class="item"><span>${a[0]}</span><b>${money(a[1])}</b></div>`).join('')||'<p class="muted">本月尚無支出</p>';list.innerHTML=x.sort((a,b)=>b.date.localeCompare(a.date)).map(a=>`<div class="item"><span>${a.note||a.category}<div class="muted">${a.date}・${a.category}</div></span><b class="${a.type==='expense'?'bad':'good'}">${a.type==='expense'?'-':'+'}${money(a.amount)}</b></div>`).join('')||'<p class="muted">本月尚無紀錄</p>'}
export.onclick=()=>{let x=r.filter(a=>a.date.startsWith(month.value)),rows=[['日期','類型','分類','金額','備註'],...x.map(a=>[a.date,a.type,a.category,a.amount,a.note])],csv='\ufeff'+rows.map(z=>z.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),u=URL.createObjectURL(new Blob([csv]));let a=document.createElement('a');a.href=u;a.download=`記帳_${month.value}.csv`;a.click()};render();
</script></body></html>
