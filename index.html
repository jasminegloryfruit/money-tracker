<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ee" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的記帳">
  <link rel="manifest" href="manifest.json">
  <title>我的記帳</title>
  <style>
    :root{
      --bg:#f7f4ee; --card:#fffdf9; --text:#2f2f2f; --muted:#7d7a73;
      --line:#e8e1d7; --accent:#72685a; --danger:#b66a6a; --good:#56765f;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
      background:var(--bg); color:var(--text);
    }
    .wrap{max-width:720px;margin:auto;padding:18px 16px 90px}
    h1{font-size:28px;margin:8px 0 4px}
    .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
    .stat,.card{
      background:var(--card); border:1px solid var(--line); border-radius:18px;
      box-shadow:0 4px 18px rgba(60,45,25,.04);
    }
    .stat{padding:14px 12px}
    .stat small{display:block;color:var(--muted);font-size:12px}
    .stat b{display:block;font-size:18px;margin-top:5px}
    .card{padding:16px;margin-top:12px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
    input,select,button{
      width:100%;border:1px solid var(--line);border-radius:13px;
      padding:12px 13px;font-size:16px;background:white;color:var(--text);
    }
    button{cursor:pointer}
    .primary{background:var(--accent);color:#fff;border:none;font-weight:700}
    .ghost{background:#fff}
    .danger{color:var(--danger)}
    .good{color:var(--good)}
    .section-title{font-size:17px;font-weight:700;margin-bottom:12px}
    .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .item{
      display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)
    }
    .item:last-child{border-bottom:none}
    .item-title{font-weight:650}
    .item-meta{color:var(--muted);font-size:12px;margin-top:4px}
    .amount{font-weight:750;white-space:nowrap}
    .empty{text-align:center;color:var(--muted);padding:18px 0}
    .bar{margin:8px 0 12px}
    .bar-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
    .track{height:10px;background:#eee8df;border-radius:99px;overflow:hidden}
    .fill{height:100%;background:var(--accent);border-radius:99px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .footnote{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
    @media(max-width:520px){
      .grid{grid-template-columns:1fr}
      .row,.filters,.actions{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
<div class="wrap">
  <h1>我的記帳</h1>
  <div class="sub">快速記錄每天收入與支出，月底自動統整。</div>

  <div class="grid">
    <div class="stat"><small>本月收入</small><b id="incomeSum" class="good">$0</b></div>
    <div class="stat"><small>本月支出</small><b id="expenseSum" class="danger">$0</b></div>
    <div class="stat"><small>本月結餘</small><b id="balanceSum">$0</b></div>
  </div>

  <div class="card">
    <div class="section-title">新增一筆</div>
    <div class="row">
      <div>
        <label>日期</label>
        <input type="date" id="date">
      </div>
      <div>
        <label>類型</label>
        <select id="type">
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div>
        <label>金額</label>
        <input type="number" id="amount" inputmode="numeric" placeholder="例如 120">
      </div>
      <div>
        <label>分類</label>
        <select id="category">
          <option>餐飲</option>
          <option>交通</option>
          <option>購物</option>
          <option>房貸</option>
          <option>水電網路</option>
          <option>娛樂</option>
          <option>醫療</option>
          <option>投資</option>
          <option>薪資</option>
          <option>獎金</option>
          <option>其他</option>
        </select>
      </div>
    </div>
    <div style="margin-top:10px">
      <label>備註</label>
      <input type="text" id="note" placeholder="例如：午餐、加油、買水果">
    </div>
    <div style="margin-top:12px">
      <button class="primary" id="addBtn">＋ 新增記帳</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">每月統整</div>
    <div class="filters">
      <div>
        <label>查看月份</label>
        <input type="month" id="monthFilter">
      </div>
      <div>
        <label>類型篩選</label>
        <select id="typeFilter">
          <option value="all">全部</option>
          <option value="expense">只看支出</option>
          <option value="income">只看收入</option>
        </select>
      </div>
    </div>
    <div id="categorySummary" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <div class="section-title">本月明細</div>
    <div id="list"></div>
    <div class="actions">
      <button class="ghost" id="exportBtn">匯出 CSV</button>
      <button class="ghost danger" id="clearBtn">清除本月資料</button>
    </div>
    <div class="footnote">資料目前儲存在你的手機瀏覽器內，不會自動上傳雲端。若清除瀏覽器網站資料，紀錄可能會被刪除，建議定期匯出 CSV 備份。</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const storageKey = 'my-money-tracker-v1';
let records = JSON.parse(localStorage.getItem(storageKey) || '[]');

function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function monthStr(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}`;
}
$('date').value = todayStr();
$('monthFilter').value = monthStr();

function money(n){ return '$' + Math.round(n).toLocaleString('zh-TW'); }

function save(){
  localStorage.setItem(storageKey, JSON.stringify(records));
  render();
}

$('addBtn').addEventListener('click', () => {
  const amount = Number($('amount').value);
  if (!amount || amount <= 0){
    alert('請輸入正確金額');
    return;
  }
  records.push({
    id: Date.now(),
    date: $('date').value || todayStr(),
    type: $('type').value,
    amount,
    category: $('category').value,
    note: $('note').value.trim()
  });
  $('amount').value = '';
  $('note').value = '';
  save();
});

$('monthFilter').addEventListener('change', render);
$('typeFilter').addEventListener('change', render);

function currentMonthRecords(){
  const month = $('monthFilter').value;
  const type = $('typeFilter').value;
  return records.filter(r => r.date.startsWith(month) && (type === 'all' || r.type === type));
}

function deleteRecord(id){
  records = records.filter(r => r.id !== id);
  save();
}
window.deleteRecord = deleteRecord;

function render(){
  const month = $('monthFilter').value;
  const monthAll = records.filter(r => r.date.startsWith(month));
  const income = monthAll.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);
  const expense = monthAll.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0);
  $('incomeSum').textContent = money(income);
  $('expenseSum').textContent = money(expense);
  $('balanceSum').textContent = money(income-expense);

  const filtered = currentMonthRecords().sort((a,b)=> b.date.localeCompare(a.date) || b.id-a.id);
  const list = $('list');
  if(!filtered.length){
    list.innerHTML = '<div class="empty">這個月份還沒有紀錄</div>';
  } else {
    list.innerHTML = filtered.map(r=>`
      <div class="item">
        <div>
          <div class="item-title">${escapeHtml(r.note || r.category)}</div>
          <div class="item-meta">${r.date} ・ ${escapeHtml(r.category)} ・ ${r.type==='expense'?'支出':'收入'}</div>
          <div class="item-meta"><button onclick="deleteRecord(${r.id})" style="width:auto;padding:2px 0;border:none;background:none;color:#b66a6a;font-size:12px">刪除</button></div>
        </div>
        <div class="amount ${r.type==='expense'?'danger':'good'}">${r.type==='expense'?'-':'+'}${money(r.amount)}</div>
      </div>
    `).join('');
  }

  const exp = monthAll.filter(r=>r.type==='expense');
  const totals = {};
  exp.forEach(r => totals[r.category] = (totals[r.category]||0)+r.amount);
  const entries = Object.entries(totals).sort((a,b)=>b[1]-a[1]);
  const max = entries.length ? entries[0][1] : 1;
  $('categorySummary').innerHTML = entries.length ? entries.map(([cat,val])=>`
    <div class="bar">
      <div class="bar-head"><span>${escapeHtml(cat)}</span><b>${money(val)}</b></div>
      <div class="track"><div class="fill" style="width:${Math.max(5,val/max*100)}%"></div></div>
    </div>
  `).join('') : '<div class="empty">這個月份還沒有支出資料</div>';
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

$('exportBtn').addEventListener('click', ()=>{
  const rows = [['日期','類型','分類','金額','備註']];
  records.filter(r=>r.date.startsWith($('monthFilter').value))
    .sort((a,b)=>a.date.localeCompare(b.date))
    .forEach(r=>rows.push([r.date,r.type==='expense'?'支出':'收入',r.category,r.amount,r.note]));
  const csv = '\uFEFF' + rows.map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`記帳_${$('monthFilter').value}.csv`; a.click();
  URL.revokeObjectURL(url);
});

$('clearBtn').addEventListener('click', ()=>{
  const month = $('monthFilter').value;
  if(confirm(`確定要清除 ${month} 的全部記帳資料嗎？`)){
    records = records.filter(r=>!r.date.startsWith(month));
    save();
  }
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
render();
</script>
</body>
</html>
